plugins {
    id "com.android.application"
}

def andropyAbi = project.findProperty("andropyAbi") ?: ""
def andropyDefaultAbis = ["arm64-v8a", "x86_64"]
def andropyOptionalAbis = ["armeabi-v7a", "x86"]
def andropyKnownAbis = andropyDefaultAbis + andropyOptionalAbis
if (andropyAbi && !andropyKnownAbis.contains(andropyAbi)) {
    throw new GradleException("Unknown Aqua ABI '${andropyAbi}'. Use one of: ${andropyKnownAbis.join(', ')}")
}
def andropyRuntimeAssets = andropyAbi == "arm64-v8a"
        ? "../release-assets/runtime-v9-arm64"
        : andropyAbi == "armeabi-v7a"
        ? "../release-assets/runtime-v9-armv7"
        : andropyAbi == "x86_64"
        ? "../release-assets/runtime-v9-x86_64"
        : andropyAbi == "x86"
        ? "../release-assets/runtime-v9-x86"
        : "../release-assets/runtime-v9"

android {
    namespace "com.andropy.ide"
    compileSdk 34
    ndkVersion "25.2.9519653"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.andropy.ide"
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "ANDROPY_ABI", "\"${andropyAbi}\""

        ndk {
            if (andropyAbi) {
                abiFilters andropyAbi
            } else {
                abiFilters(*andropyDefaultAbis)
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "ANDROPY_PREBUNDLED_RUNTIME", "true"
            buildConfigField "boolean", "ANDROPY_SKIP_RUNTIME_CHECK", "true"
        }
        release {
            buildConfigField "boolean", "ANDROPY_PREBUNDLED_RUNTIME", "false"
            buildConfigField "boolean", "ANDROPY_SKIP_RUNTIME_CHECK", "false"
        }
    }

    sourceSets {
        debug {
            assets.srcDirs += [andropyRuntimeAssets]
        }
    }

}

dependencies {
    implementation(platform("io.github.rosemoe:editor-bom:0.24.4"))
    implementation "io.github.rosemoe:editor"
    implementation "com.termux.termux-app:terminal-view:0.118.0"
    implementation "com.github.luben:zstd-jni:1.5.7-9@aar"
}
